name: Build Clarity OMR Appliance ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    name: Build Debian 12 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            xorriso \
            squashfs-tools \
            debootstrap \
            syslinux-common \
            syslinux-utils \
            isolinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools
          command -v isohybrid

      - name: Configure and build live ISO
        run: |
          cd live-build
          sudo lb clean --purge
          sudo sed -i 's|/Contents-|/main/Contents-|g' /usr/lib/live/build/lb_chroot_linux-image
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --bootloader syslinux,grub-efi \
            --debian-installer false \
            --memtest none \
            --security false \
            --iso-application "Clarity OMR Appliance" \
            --iso-publisher "Local build" \
            --iso-volume CLARITY_OMR \
            --bootappend-live "boot=live components quiet splash noeject hostname=clarity-omr username=appliance"
          sudo lb build

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-omr-appliance-iso
          path: live-build/live-image-amd64.hybrid.iso
          if-no-files-found: error
