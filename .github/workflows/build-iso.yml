name: Build Clarity OMR Appliance ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build xorriso squashfs-tools debootstrap syslinux-common isolinux grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Patch live-build Debian server bug
        run: |
          sudo sed -i 's|/Contents-|/main/Contents-|g' /usr/lib/live/build/lb_chroot_linux-image

      - name: Configure and Compile ISO
        run: |
          cd live-build
          sudo lb clean --purge
          sudo rm -rf auto/
          sudo lb config --mode debian --distribution bookworm --architectures amd64 --archive-areas "main contrib non-free non-free-firmware" --binary-images iso-hybrid --bootloader syslinux,grub-efi --debian-installer none --memtest none --iso-application "Clarity OMR Appliance" --iso-publisher "Local build" --iso-volume CLARITY_OMR --security false --bootappend-live "boot=live components quiet splash noeject hostname=clarity-omr username=appliance"
          sudo lb build

      - name: Upload Bootable ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-omr-appliance-iso
          path: live-build/live-image-amd64.hybrid.iso
          if-no-files-found: error
