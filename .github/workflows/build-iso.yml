name: Build Clarity OMR Appliance ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-iso:
    name: Build Debian 12 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            xorriso \
            squashfs-tools \
            debootstrap \
            syslinux-common \
            syslinux-utils \
            syslinux \
            isolinux \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools
          ISOHYBRID_PATH="$(command -v isohybrid || true)"
          if [ -z "${ISOHYBRID_PATH}" ]; then
            ISOHYBRID_PATH="$(dpkg -L syslinux-utils | grep '/isohybrid$' | head -n 1 || true)"
          fi
          if [ -z "${ISOHYBRID_PATH}" ]; then
            echo "isohybrid was not found after installing syslinux-utils."
            dpkg -L syslinux-utils || true
            exit 127
          fi
          sudo install -D -m 0755 "${ISOHYBRID_PATH}" /usr/local/bin/isohybrid
          sudo ln -sf /usr/local/bin/isohybrid /usr/bin/isohybrid
          sudo mkdir -p /root/isolinux
          sudo cp -L /usr/lib/ISOLINUX/isolinux.bin /root/isolinux/isolinux.bin
          sudo cp -L /usr/lib/syslinux/modules/bios/vesamenu.c32 /root/isolinux/vesamenu.c32
          sudo cp -L /usr/lib/syslinux/modules/bios/ldlinux.c32 /root/isolinux/ldlinux.c32
          sudo cp -L /usr/lib/syslinux/modules/bios/libcom32.c32 /root/isolinux/libcom32.c32
          sudo cp -L /usr/lib/syslinux/modules/bios/libutil.c32 /root/isolinux/libutil.c32
          sudo cp -L /usr/lib/syslinux/modules/bios/menu.c32 /root/isolinux/menu.c32
          command -v isohybrid
          ls -l /usr/local/bin/isohybrid /usr/bin/isohybrid
          sudo ls -l /root/isolinux

      - name: Configure and build live ISO
        run: |
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH}"
          command -v isohybrid
          cd live-build
          sudo lb clean noauto --purge
          sudo sed -i 's|/Contents-|/main/Contents-|g' /usr/lib/live/build/lb_chroot_linux-image
          sudo grep -R "/root/isolinux" -n /usr/lib/live/build /usr/share/live/build 2>/dev/null || true
          sudo find /usr/lib/live/build /usr/share/live/build -type f -exec sed -i \
            -e 's|/root/isolinux/isolinux.bin|/usr/lib/ISOLINUX/isolinux.bin|g' \
            -e 's|/root/isolinux/vesamenu.c32|/usr/lib/syslinux/modules/bios/vesamenu.c32|g' \
            -e 's|/root/isolinux/menu.c32|/usr/lib/syslinux/modules/bios/menu.c32|g' \
            -e 's|/root/isolinux/ldlinux.c32|/usr/lib/syslinux/modules/bios/ldlinux.c32|g' \
            -e 's|/root/isolinux/libcom32.c32|/usr/lib/syslinux/modules/bios/libcom32.c32|g' \
            -e 's|/root/isolinux/libutil.c32|/usr/lib/syslinux/modules/bios/libutil.c32|g' \
            {} +
          sudo grep -R "/root/isolinux" -n /usr/lib/live/build /usr/share/live/build 2>/dev/null || true
          sudo lb config noauto \
            --mode debian \
            --distribution bookworm \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --build-with-chroot false \
            --bootloader syslinux \
            --debian-installer false \
            --memtest none \
            --security false \
            --iso-application "Clarity OMR Appliance" \
            --iso-publisher "Local build" \
            --iso-volume CLARITY_OMR \
            --bootappend-live "boot=live components quiet splash noeject hostname=clarity-omr username=appliance"
          sudo env PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" lb build noauto

      - name: Upload bootable ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarity-omr-appliance-iso
          path: live-build/live-image-amd64.hybrid.iso
          if-no-files-found: error
